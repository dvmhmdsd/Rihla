services:
  postgres:
    image: postgres:17-alpine
    container_name: rihla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rihla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rihla}
      POSTGRES_DB: ${POSTGRES_DB:-rihla}
      # Deterministic collation so text ordering does not drift between
      # machines. Matters once Arabic/English search lands.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=und'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - rihla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rihla} -d ${POSTGRES_DB:-rihla}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rihla-pgdata:
    name: rihla-pgdata
