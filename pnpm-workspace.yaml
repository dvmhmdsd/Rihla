packages:
  - 'apps/*'
  - 'packages/*'

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  # lefthook's postinstall only runs `lefthook install`, which the root
  # `prepare` script already does explicitly. Ignoring it keeps the hooks
  # wired without granting a dependency build-script rights.
  - lefthook
